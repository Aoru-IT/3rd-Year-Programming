<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Bank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Lexend';
        }

        body {
            background-color: #2c3b55;
            margin: 0;
            padding: 0;
        }

        .header {
            padding-top: 40px;
            padding-bottom: 20px;
            width: 16%;
            margin: 0 auto;
        }

        .atm {
            margin: 3vh auto;
            width: 40%;
            padding: 30px 30px 50px 30px;
            background-color: #eff1f4;
            border-radius: 10px;
            color: #283546;
            box-shadow: 0 10px 8px rgba(0, 0, 0, 0.2), 0 6px 20px rgba(0, 0, 0, 0.19);
        }

        .atm h1 {
            text-align: center;
            font-size: 40px;
        }

        .atmfields {
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .atm hr {
            width: 90%;
        }

        .atmfields input[type="number"] {
            padding: 10px 70px;
            border-radius: 10px;
            border-style: none;
            text-align: center;
        }

        .atm input[type="button"] {
            background-color: #caffb9;
            border-radius: 10px;
            border-style: none;
            padding: 15px;
            margin: 5px;
            cursor: pointer;
        }

        .atm input[type="button"]:hover {
            background-color: #b4e1a5;
            transition: 0.3s;
        }

        .receipt {
            display: none;
            width: 40%;
            margin: 20px auto;
            background: #eff1f4;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            color: #283546;
        }

        .receipt img {
            width: 200px;
            height: auto;
            display: block;
            margin: 0 auto 20px auto;
        }

        .receipt p {
            margin: 8px 0;
            font-size: 16px;
        }

        .thankyou {
            text-align: center;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://www.securitybank.com/wp-content/themes/sb/img/sbc-logo-new.svg" width="300" height="60" />
    </div>

    <div class="atm">
        <h1>ATM Machine</h1>
        <hr>
        <div class="atmfields">
            <h3 id="balance">Current Balance:&nbsp;&nbsp;| ₱0.00</h3>
            <input type="number" step="0.01" id="numberField" placeholder="Amount in Pesos (₱)" /> <br/><br/>  
            <input type="button" value="Check Balance" onclick="checkBalance()"/>
            <input type="button" value="Deposit" onclick="depositBalance()"/>
            <input type="button" value="Withdraw" onclick="withdrawBalance()"/>
            <input type="button" value="Print Receipt" onclick="printReceipt()" />
            <p id="action"></p>
        </div>
    </div>

    <div class="receipt" id="receiptSection">
        <p><strong>Date:</strong> <span id="receiptDate"></span></p>
        <p><strong>Time:</strong> <span id="receiptTime"></span></p>
        <p><strong>Transaction:</strong> <span id="receiptAction"></span></p>
        <p><strong>Amount:</strong> ₱<span id="receiptAmount"></span></p>
        <p><strong>Remaining Balance:</strong> ₱<span id="receiptBalance"></span></p>
        <p class="thankyou">Thank you for transacting with us!</p>
    </div>

    <script>
        let balance = 0.00;
        let value = 0.00;
        let action = "";

        function updateReceipt() {
            const now = new Date();
            document.getElementById("receiptDate").innerText = now.toLocaleDateString();
            document.getElementById("receiptTime").innerText = now.toLocaleTimeString();
            document.getElementById("receiptAction").innerText = action;
            document.getElementById("receiptAmount").innerText = value.toFixed(2);
            document.getElementById("receiptBalance").innerText = balance.toFixed(2);
            document.getElementById("receiptSection").style.display = "block";
        }

        function checkBalance() {
            document.getElementById("balance").innerHTML = `Current Balance:&nbsp;&nbsp;| ₱${balance.toFixed(2)}`;
        }

        function depositBalance() {
            value = parseFloat(document.getElementById("numberField").value);
            if (isNaN(value) || value <= 0) {
                alert("Please enter a valid amount.");
                return;
            }
            balance += value;
            action = "Deposit";
            document.getElementById("balance").innerHTML = `Current Balance:&nbsp;&nbsp;| ₱${balance.toFixed(2)}`;
            document.getElementById("action").innerHTML = `Deposited ₱${value.toFixed(2)} into account.`;
            updateReceipt();
        }

        function withdrawBalance() {
            value = parseFloat(document.getElementById("numberField").value);
            if (isNaN(value) || value <= 0) {
                alert("Please enter a valid amount.");
                return;
            }
            if (balance < value) {
                alert("Not enough balance! Please try again.");
                return;
            }
            balance -= value;
            action = "Withdraw";
            document.getElementById("balance").innerHTML = `Current Balance:&nbsp;&nbsp;| ₱${balance.toFixed(2)}`;
            document.getElementById("action").innerHTML = `Withdrew ₱${value.toFixed(2)} from account.`;
            updateReceipt();
        }

        function printReceipt() {
            const printContents = document.getElementById("receiptSection").innerHTML;

            const html = `
            <html>
            <head><title>Print Receipt</title>
                 <style>
                    * {
                        font-family: 'Lexend', sans-serif;
                    }
                    body {
                        padding: 20px;
                        background: #eff1f4;
                        color: #283546;
                    }
                    p {
                        margin: 8px 0;
                        font-size: 16px;
                    }
                    .thankyou {
                        text-align: center;
                        margin-top: 20px;
                        font-style: italic;
                    }
                </style>
                </head>
                <body>
                ${printContents}    
                </body>
                </html>`;
            
            const win = window.open('', '', 'height=600,width=400');
            win.document.open();

            win.document.write(html);
            win.focus();
            win.print();
            win.close();
        }
    </script>
</body>
</html>
